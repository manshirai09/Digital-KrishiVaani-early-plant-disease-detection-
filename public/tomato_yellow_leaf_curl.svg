<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Background Cardboard/Table surface -->
    <radialGradient id="bgGrad" cx="45%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#938173"/>
      <stop offset="35%" stop-color="#887669"/>
      <stop offset="70%" stop-color="#766456"/>
      <stop offset="100%" stop-color="#5f4e42"/>
    </radialGradient>

    <!-- Deep Green Center Lamina -->
    <radialGradient id="leafCenter" cx="49%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#143610"/>
      <stop offset="30%" stop-color="#1c4717"/>
      <stop offset="55%" stop-color="#2a5d20"/>
      <stop offset="75%" stop-color="#4d7927"/>
      <stop offset="90%" stop-color="#8ea82d"/>
      <stop offset="100%" stop-color="#c1d942"/>
    </radialGradient>

    <!-- Yellow-Green Chlorotic Upward Margins Left -->
    <linearGradient id="curlRimLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8dc43"/>
      <stop offset="40%" stop-color="#abc631"/>
      <stop offset="80%" stop-color="#5b7e21"/>
      <stop offset="100%" stop-color="#224816"/>
    </linearGradient>

    <!-- Yellow-Green Chlorotic Upward Margins Right -->
    <linearGradient id="curlRimRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4e64b"/>
      <stop offset="40%" stop-color="#b4cf36"/>
      <stop offset="80%" stop-color="#658824"/>
      <stop offset="100%" stop-color="#264c18"/>
    </linearGradient>

    <!-- Basal curled lobe -->
    <linearGradient id="basalCup" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#698522"/>
      <stop offset="50%" stop-color="#a8c534"/>
      <stop offset="80%" stop-color="#3c611d"/>
      <stop offset="100%" stop-color="#193b11"/>
    </linearGradient>

    <!-- Petiole Base -->
    <linearGradient id="petioleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#738b30"/>
      <stop offset="60%" stop-color="#9eb641"/>
      <stop offset="100%" stop-color="#546522"/>
    </linearGradient>
  </defs>

