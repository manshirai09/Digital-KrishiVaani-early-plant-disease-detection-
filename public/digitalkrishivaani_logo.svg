<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1260" width="1000" height="1260" fill="none">
  <defs>
    <!-- Protective Shield Gradient -->
    <linearGradient id="krShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#064e3b" />
      <stop offset="60%" stopColor="#065f46" />
      <stop offset="100%" stopColor="#047857" />
    </linearGradient>

    <!-- Right Dominant Leaf Left (Dark/Foliage side) -->
    <linearGradient id="krLeafRDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#065f46" />
      <stop offset="40%" stopColor="#059669" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>

    <!-- Right Dominant Leaf Right (Sunlit Lime/Spring side) -->
    <linearGradient id="krLeafRLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="45%" stopColor="#34d399" />
      <stop offset="85%" stopColor="#84cc16" />
      <stop offset="100%" stopColor="#a3e635" />
    </linearGradient>

    <!-- Left Branching Leaf Top (Vibrant Spring) -->
    <linearGradient id="krLeafLTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#84cc16" />
      <stop offset="30%" stopColor="#4ade80" />
      <stop offset="100%" stopColor="#16a34a" />
    </linearGradient>

    <!-- Left Branching Leaf Bottom (Deep Green) -->
    <linearGradient id="krLeafLBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#16a34a" />
      <stop offset="70%" stopColor="#15803d" />
      <stop offset="100%" stopColor="#14532d" />
    </linearGradient>

    <!-- Field Terraces Gradients -->
    <linearGradient id="krFurrowTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#15803d" />
      <stop offset="100%" stopColor="#16a34a" />
    </linearGradient>
    <linearGradient id="krFurrowMid1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#166534" />
      <stop offset="100%" stopColor="#15803d" />
    </linearGradient>
    <linearGradient id="krFurrowMid2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#14532d" />
      <stop offset="100%" stopColor="#166534" />
    </linearGradient>
    <linearGradient id="krFurrowBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#064e3b" />
      <stop offset="100%" stopColor="#0f5338" />
    </linearGradient>

    <!-- Right Perspective Contour Plots -->
    <linearGradient id="krPlotTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#a3e635" />
      <stop offset="100%" stopColor="#65a30d" />
    </linearGradient>
    <linearGradient id="krPlotMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4ade80" />
      <stop offset="100%" stopColor="#16a34a" />
    </linearGradient>
    <linearGradient id="krPlotLow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#22c55e" />
      <stop offset="100%" stopColor="#15803d" />
    </linearGradient>
  </defs>
  <g transform="translate(50, 20) scale(0.9)">

  <g id="krishirakshak-emblem-core">
    <!-- 1. Outer Protective Crescent Shield -->
    <path d="M 178 335 C 125 418 80 515 80 625 C 80 775 195 860 480 860 C 648 860 788 812 940 648 C 895 728 765 810 515 810 C 265 810 148 720 148 588 C 148 495 170 415 220 350 Z"
          fill="url(#krShield)" />

    <!-- 2. Central Sprout Stem -->
    <path d="M 552 575 C 555 540 550 515 545 480 C 538 515 536 540 538 575 Z"
          fill="#065f46" />

    <!-- 3. Right Dominant Leaf -->
    <path d="M 545 480 C 585 360 675 235 930 125 C 810 240 680 360 545 480 Z"
          fill="url(#krLeafRDark)" />
    <path d="M 545 480 C 680 360 810 240 930 125 C 950 240 860 380 720 480 C 660 520 590 500 545 480 Z"
          fill="url(#krLeafRLight)" />
    <!-- Fine midrib spine line -->
    <path d="M 545 480 C 680 360 810 240 930 125"
          stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7" />

    <!-- 4. Left Branching Leaf -->
    <path d="M 535 490 C 470 380 390 340 272 332 C 340 400 440 460 535 490 Z"
          fill="url(#krLeafLTop)" />
    <path d="M 535 490 C 440 460 340 400 272 332 C 330 460 420 500 515 505 Z"
          fill="url(#krLeafLBottom)" />
    <!-- Fine midrib spine line -->
    <path d="M 535 490 C 440 460 340 400 272 332"
          stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" />

    <!-- 5. Agricultural Field Furrows (Contour Terraces) -->
    <!-- Row 1: Top primary terrace -->
    <path d="M 168 582 C 300 575 480 575 628 582 C 600 605 450 600 182 605 Z"
          fill="url(#krFurrowTop)" />

    <!-- Row 2: Second terrace furrow -->
    <path d="M 188 616 C 350 612 520 612 660 622 C 625 648 440 640 215 648 Z"
          fill="url(#krFurrowMid1)" />

    <!-- Row 3: Third terrace furrow -->
    <path d="M 224 660 C 390 655 580 660 765 735 C 720 765 520 705 260 705 Z"
          fill="url(#krFurrowMid2)" />

    <!-- Row 4: Base deep furrow -->
    <path d="M 275 720 C 420 720 580 760 700 805 C 620 825 450 780 330 770 Z"
          fill="url(#krFurrowBase)" />

    <!-- Right Perspective Plot 1 (Top right contour) -->
    <path d="M 645 585 C 740 580 840 575 938 585 C 910 608 810 605 690 608 Z"
          fill="url(#krPlotTop)" />

    <!-- Right Perspective Plot 2 (Mid right contour) -->
    <path d="M 708 618 C 790 618 870 618 930 610 C 910 632 820 645 745 645 Z"
          fill="url(#krPlotMid)" />

    <!-- Right Perspective Plot 3 (Lower right contour) -->
    <path d="M 760 655 C 830 655 890 650 918 640 C 890 670 820 685 798 700 Z"
          fill="url(#krPlotLow)" />
  </g>

  </g>
  <!-- Brand Name Typography -->
  <g transform="translate(500, 990)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="82" font-weight="800" letter-spacing="-0.03em" fill="#064e3b">
      Digital <tspan fill="#10b981">KrishiVaani</tspan>
    </text>
  </g>
  <!-- Tagline Typography -->
  <g transform="translate(500, 1070)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="34" font-weight="600" letter-spacing="0.15em" fill="#2d6a4f">
      AAPKA AI KRISHI SAATHI
    </text>
  </g>
</svg>